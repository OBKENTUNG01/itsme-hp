name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi (label di HP)"
        required: false
        default: ""
      accent:
        description: "Warna ikon, hex mis. #4F8CFF"
        required: false
        default: ""
      app_id:
        description: "Application ID (mis. com.itsme.hp)"
        required: false
        default: ""
      version_name:
        description: "Nama versi (mis. 0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Terapkan pilihan dari Pembuat Aplikasi dashboard (nama, warna, id, versi).
      # Kosong (mis. build dari push) = aplikasi apa adanya. versionCode dinaikkan
      # tiap build supaya APK baru bisa menimpa yang lama saat dipasang.
      - name: Customize app
        run: python3 tools/customize.py
        env:
          HP_APP_NAME: ${{ github.event.inputs.app_name }}
          HP_ACCENT: ${{ github.event.inputs.accent }}
          HP_APP_ID: ${{ github.event.inputs.app_id }}
          HP_VERSION_NAME: ${{ github.event.inputs.version_name }}
          HP_VERSION_CODE: ${{ github.run_number }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK Android sudah terpasang di runner ubuntu (lisensi diterima, ANDROID_HOME diset);
      # AGP akan mengunduh komponen yang kurang sendiri. Tidak pakai setup-android karena
      # versi aksinya mencoba memasang paket 'tools' yang sudah usang.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Kalau 4 secret keystore ada, APK ditandatangani dengan kunci rilis tetap
      # (lebih tepercaya, update bisa menimpa versi lama). Kalau belum ada, build
      # tetap jalan dengan kunci debug - jalankan workflow "make-keystore" sekali
      # lalu tambahkan secret-nya (lihat README).
      - name: Decode keystore (kalau ada secret)
        id: ks
        env:
          KS_B64: ${{ secrets.ITSME_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/itsme.keystore"
            echo "path=$RUNNER_TEMP/itsme.keystore" >> "$GITHUB_OUTPUT"
            echo "APK akan ditandatangani dengan kunci rilis."
          else
            echo "Tanpa keystore: APK pakai kunci debug (cadangan)."
          fi

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace
        env:
          ITSME_KEYSTORE: ${{ steps.ks.outputs.path }}
          ITSME_KEYSTORE_PASSWORD: ${{ secrets.ITSME_KEYSTORE_PASSWORD }}
          ITSME_KEY_ALIAS: ${{ secrets.ITSME_KEY_ALIAS }}
          ITSME_KEY_PASSWORD: ${{ secrets.ITSME_KEY_PASSWORD }}

      - name: Prepare APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$apk" || { echo "APK rilis tidak ditemukan"; exit 1; }
          cp "$apk" itsme-hp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsme-hp-apk
          path: itsme-hp.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: It's Me HP - APK terbaru
          body: |
            Unduh **itsme-hp.apk** di bawah, pasang di HP-mu (izinkan "pasang aplikasi tidak dikenal" sekali),
            buka aplikasinya, lalu isi alamat dashboard It's Me-mu dan token dari tab HP di dashboard.
          files: itsme-hp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
