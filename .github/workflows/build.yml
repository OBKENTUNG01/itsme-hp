name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app_name:
        description: "Nama aplikasi (label di HP)"
        required: false
        default: ""
      accent:
        description: "Warna ikon, hex mis. #4F8CFF"
        required: false
        default: ""
      app_id:
        description: "Application ID (mis. com.itsme.hp)"
        required: false
        default: ""
      version_name:
        description: "Nama versi (mis. 0.2)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Terapkan pilihan dari Pembuat Aplikasi dashboard (nama, warna, id, versi).
      # Kosong (mis. build dari push) = aplikasi apa adanya. versionCode dinaikkan
      # tiap build supaya APK baru bisa menimpa yang lama saat dipasang.
      - name: Customize app
        run: python3 tools/customize.py
        env:
          HP_APP_NAME: ${{ github.event.inputs.app_name }}
          HP_ACCENT: ${{ github.event.inputs.accent }}
          HP_APP_ID: ${{ github.event.inputs.app_id }}
          HP_VERSION_NAME: ${{ github.event.inputs.version_name }}
          HP_VERSION_CODE: ${{ github.run_number }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK Android sudah terpasang di runner ubuntu (lisensi diterima, ANDROID_HOME diset);
      # AGP akan mengunduh komponen yang kurang sendiri. Tidak pakai setup-android karena
      # versi aksinya mencoba memasang paket 'tools' yang sudah usang.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.9'

      # Kalau secret keystore ada, APK ditandatangani dengan kunci rilis tetap
      # (lebih tepercaya, update bisa menimpa versi lama). Kalau belum ada, build
      # tetap jalan dengan kunci debug. Kunci rilis dibuat DI KOMPUTER pemilik dengan
      # tools/buat-kunci.ps1 (lihat README) - JANGAN lewat Actions: artefak di repo
      # publik bisa diunduh siapa pun yang punya akun GitHub.
      - name: Decode keystore (kalau ada secret)
        id: ks
        env:
          KS_B64: ${{ secrets.ITSME_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/itsme.keystore"
            echo "path=$RUNNER_TEMP/itsme.keystore" >> "$GITHUB_OUTPUT"
            echo "APK akan ditandatangani dengan kunci rilis."
          else
            echo "Tanpa keystore: APK pakai kunci debug (cadangan)."
          fi

      # Coba tanda tangan RILIS dulu. Kalau gagal (mis. secret sandi keystore salah),
      # JANGAN gagalkan build - ulangi tanpa keystore supaya APK tetap jadi memakai
      # kunci debug (tetap bisa dipasang). Perbaiki ITSME_KEYSTORE_PASSWORD untuk rilis.
      - name: Build release APK
        run: |
          if ! gradle assembleRelease --no-daemon --stacktrace; then
            echo "::warning::Tanda tangan rilis gagal (cek secret ITSME_KEYSTORE_PASSWORD). Membuat APK dengan kunci debug supaya tetap bisa dipasang."
            unset ITSME_KEYSTORE ITSME_KEYSTORE_PASSWORD ITSME_KEY_ALIAS ITSME_KEY_PASSWORD
            gradle assembleRelease --no-daemon --stacktrace
          fi
        env:
          ITSME_KEYSTORE: ${{ steps.ks.outputs.path }}
          ITSME_KEYSTORE_PASSWORD: ${{ secrets.ITSME_KEYSTORE_PASSWORD }}
          ITSME_KEY_ALIAS: ${{ secrets.ITSME_KEY_ALIAS }}
          ITSME_KEY_PASSWORD: ${{ secrets.ITSME_KEY_PASSWORD }}

      # Kunci rilis tidak boleh tertinggal di runner selama langkah berikutnya (termasuk aksi
      # pihak ketiga) berjalan: hapus segera setelah build, berhasil atau gagal.
      - name: Hapus keystore dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/itsme.keystore"

      - name: Prepare APK
        run: |
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$apk" || { echo "APK rilis tidak ditemukan"; exit 1; }
          cp "$apk" itsme-hp.apk

      # Sidik jari sertifikat penanda tangan (informasi PUBLIK, bukan rahasia) supaya bisa
      # dicocokkan dengan SIDIK-JARI.txt dari tools/buat-kunci.ps1. "CN=Android Debug" berarti
      # APK memakai kunci debug cadangan (secret keystore belum ada atau sandinya salah).
      - name: Sidik jari tanda tangan APK
        run: |
          bt=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)
          out=$("$ANDROID_HOME/build-tools/$bt/apksigner" verify --print-certs itsme-hp.apk)
          dn=$(echo "$out" | sed -n 's/.*certificate DN: //p' | head -n1)
          hex=$(echo "$out" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1)
          test -n "$hex" || { echo "Sidik jari tanda tangan tidak terbaca"; exit 1; }
          # Format sama dengan SIDIK-JARI.txt (huruf besar, dipisah titik dua).
          fmt=$(echo "$hex" | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          printf 'Penanda tangan : %s\nSHA-256        : %s\n' "$dn" "$fmt"
          { echo '```'; printf 'Penanda tangan : %s\nSHA-256        : %s\n' "$dn" "$fmt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsme-hp-apk
          path: itsme-hp.apk

      # Hanya dari main (push, atau Buat APK di dashboard yang memicu ref main). Build uji dari
      # cabang lain cukup menghasilkan artefak, tidak menimpa APK publik.
      - name: Publish to Releases (latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: latest
          name: It's Me HP - APK terbaru
          body: |
            Unduh **itsme-hp.apk** di bawah, pasang di HP-mu (izinkan "pasang aplikasi tidak dikenal" sekali),
            buka aplikasinya, lalu isi alamat dashboard It's Me-mu dan token dari tab HP di dashboard.
          files: itsme-hp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
