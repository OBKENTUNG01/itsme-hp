name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # SDK Android sudah terpasang di runner ubuntu (lisensi diterima, ANDROID_HOME diset);
      # AGP akan mengunduh komponen yang kurang sendiri. Tidak pakai setup-android karena
      # versi aksinya mencoba memasang paket 'tools' yang sudah usang.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk itsme-hp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: itsme-hp-apk
          path: itsme-hp.apk

      - name: Publish to Releases (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: It's Me HP - APK terbaru
          body: |
            Unduh **itsme-hp.apk** di bawah, pasang di HP-mu (izinkan "pasang aplikasi tidak dikenal" sekali),
            buka aplikasinya, lalu isi alamat dashboard It's Me-mu dan token dari tab HP di dashboard.
          files: itsme-hp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
