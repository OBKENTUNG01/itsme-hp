name: make-keystore

# Jalankan SEKALI (tab Actions -> make-keystore -> Run workflow) untuk membuat kunci
# penandatangan RILIS yang tetap. Unduh artifact "itsme-keystore", lalu tambahkan 4
# secret yang tertera di SECRETS.txt ke repo (Settings -> Secrets and variables ->
# Actions). Setelah itu setiap build APK (workflow build-apk) ditandatangani dengan
# kunci ini, jadi APK lebih tepercaya dan update bisa menimpa versi lama. Simpan
# berkas itsme.keystore sebagai cadangan; JANGAN commit ke repo.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate keystore + secrets
        run: |
          mkdir -p out
          # Satu sandi untuk store DAN key. Keystore PKCS12 (bawaan keytool) memang
          # memakai sandi store yang sama untuk key, jadi sandi terpisah cuma bikin
          # bingung dan sering salah tempel. Cukup 1 sandi -> 1 secret.
          PW=$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 28)
          ALIAS=itsme
          keytool -genkeypair -v -keystore out/itsme.keystore -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PW" -keypass "$PW" \
            -dname "CN=ItsMe HP, OU=ItsMe, O=ItsMe, C=ID"
          base64 -w0 out/itsme.keystore > out/ITSME_KEYSTORE_B64.txt
          {
            echo "Tambahkan 2 secret ini di repo:"
            echo "  Settings > Secrets and variables > Actions > New repository secret"
            echo
            echo "  ITSME_KEYSTORE_B64      = (seluruh isi berkas ITSME_KEYSTORE_B64.txt)"
            echo "  ITSME_KEYSTORE_PASSWORD = $PW"
            echo
            echo "Alias kunci sudah tetap 'itsme' dan sandi key = sandi store,"
            echo "jadi TIDAK perlu secret ITSME_KEY_ALIAS / ITSME_KEY_PASSWORD."
            echo "Simpan itsme.keystore sebagai cadangan. JANGAN commit ke repo."
            echo "Setelah secret ditambahkan, jalankan build-apk (atau Buat APK di dashboard)."
          } > out/SECRETS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: itsme-keystore
          path: out/
